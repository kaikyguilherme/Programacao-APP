<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Tabuada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gerador de Tabuada</h1>

    <label for="numeroInput">Digite um Numero: </label>
    <input type="number" id="numero-input" placeholder="Ex.: 5">
    <button id="btn-gerar">Gerar Tabuada</button>

    <div id="resultado-aqui">
        <!-- a tabuada sera gerada aqui. -->
        <!-- só mostrara conteudo quando o script.js gerar a tabuada -->
    </div>

    <!-- o comando abaixo ira chamar o arquivo.js -->
    <script src="script.js"></script>
</body>
</html>
